name: Build-Tetorisu

on: push

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            autoconf
            automake
            libtool
            git
            make

      - name: Build raylib and enet
        shell: msys2 {0}
        run: |
          git clone https://github.com/raysan5/raylib.git
          cd raylib/src
          make PLATFORM=PLATFORM_DESKTOP
          cd ../..
          git clone https://github.com/lsalzman/enet.git
          cd enet
          autoreconf -vfi
          ./configure
          make
          cd ..

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          mkdir build
          cd build
          cmake .. \
            -DRAYLIB_INCLUDE_DIR=$(pwd)/../raylib/src \
            -DRAYLIB_LIBRARY=$(pwd)/../raylib/src/libraylib.a \
            -DENET_INCLUDE_DIR=$(pwd)/../enet/include \
            -DENET_LIBRARY=$(pwd)/../enet/.libs/libenet.a

      - name: Build
        shell: msys2 {0}
        run: |
          cd build
          cmake --build .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetorisu-windows
          path: build/tetorisu.exe

  build-mac:
    name: Build on Mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install raylib cmake autoconf automake libtool

      - name: Build enet from source
        run: |
          git clone https://github.com/lsalzman/enet.git
          cd enet
          autoreconf -vfi
          ./configure
          make
          cd ..

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. \
            -DENET_INCLUDE_DIR=$(pwd)/../enet/include \
            -DENET_LIBRARY=$(pwd)/../enet/.libs/libenet.dylib

      - name: Build
        run: |
          cd build
          cmake --build .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetorisu-macos
          path: build/tetorisu