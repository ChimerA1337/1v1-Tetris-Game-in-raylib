name: Build Tetorisu

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: tetorisu
            asset_name: tetorisu-linux
          - os: macos-latest
            artifact_name: tetorisu
            asset_name: tetorisu-macos
          - os: windows-latest
            artifact_name: tetorisu.exe
            asset_name: tetorisu-windows.exe

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libraylib-dev libenet-dev cmake build-essential

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install raylib enet cmake

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install raylib enet cmake -y

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake ..

    - name: Build
      run: |
        cd build
        cmake --build .

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: build/${{ matrix.artifact_name }}