name: Build-Tetorisu

on: push

jobs:
  build-mac:
    name: Build On Mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: | 
          brew install raylib enet cmake
      
      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake ..
      
      - name: Build
        run: |
          cd build
          cmake --build . 
