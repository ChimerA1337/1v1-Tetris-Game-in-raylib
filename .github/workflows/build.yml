name: Build-Tetorisu

on: push

jobs:
  build-mac:
    name: Build On Mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install raylib cmake autoconf automake libtool

      - name: Build enet from source
        run: |
          git clone https://github.com/lsalzman/enet.git
          cd enet
          ls
          autoreconf -vfi
          ./configure
          make
          make install
          cd ..

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake ..

      - name: Build
        run: |
          cd build
          cmake --build .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetorisu-macos
          path: build/tetorisu