name: Build-Tetorisu

on: push

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake and git
        run: |
          choco install cmake git -y
          
      - name: Install raylib and enet via vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          bootstrap-vcpkg.bat
          vcpkg integrate install
          vcpkg install raylib
          vcpkg install enet

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake ..

      - name: Build
        run: |
          cd build
          cmake --build .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetorisu-windows
          path: build/tetorisu.vcxproj # This gives no fucking file for some reason aaaa

  build-mac:
    name: Build on Mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install raylib cmake autoconf automake libtool

      - name: Build enet from source
        run: |
          git clone https://github.com/lsalzman/enet.git
          cd enet
          autoreconf -vfi
          ./configure
          make
          cd ..

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. \
            -DENET_INCLUDE_DIR=$(pwd)/../enet/include \
            -DENET_LIBRARY=$(pwd)/../enet/.libs/libenet.dylib

      - name: Build
        run: |
          cd build
          cmake --build .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetorisu-macos
          path: build/tetorisu