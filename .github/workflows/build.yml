name: Build-Tetorisu

on: push

jobs:
  build-mac:
    name: Build On Mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install raylib enet cmake pkg-config

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. \
            -DCMAKE_PREFIX_PATH=/opt/homebrew \
            -DPKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig

      - name: Build
        run: |
          cd build
          cmake --build .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetorisu-macos
          path: build/tetorisu